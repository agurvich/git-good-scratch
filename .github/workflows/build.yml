name: Build

# Builds the package and the coverage report, and keeps both as
# downloadable artifacts on the run page. Runs on every push to main and
# every pull request, nightly, and on demand from the "Run workflow" button.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly at 03:17 UTC

permissions:
  contents: read

jobs:
  wheel:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build the wheel and source archive
        run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wb-analytics-dist
          path: dist/
          retention-days: 30

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run the tests and write an HTML coverage report
        run: pytest --cov=wb_analytics --cov-report=term --cov-report=html
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30
