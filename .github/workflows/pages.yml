name: Publish coverage report

# Every push to main publishes the HTML coverage report as the repo's
# GitHub Pages website. The deploy job targets the `github-pages`
# environment, which is what puts it in the repo's "Deployments" box.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build coverage site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run the tests and write an HTML coverage report
        run: pytest --cov=wb_analytics --cov-report=html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: htmlcov/

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
